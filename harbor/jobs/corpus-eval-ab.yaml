# Corpus A/B: the 19-task eval slice, baseline vs akm-static.
#
# This is the run that can actually test whether akm HELPS, as opposed to
# whether the plumbing works (that is p0-corpus.yaml). The slice's drillbit--*
# and inkwell--* families name FICTIONAL tools whose syntax exists only in the
# per-task stash, so a baseline arm has to invent it; the workflow-compliance--*
# families deliberately test the opposite reflex (a `noisy` stash full of
# plausible-but-wrong material, or a `minimal` stash with no answer at all),
# where NOT reaching for akm is the correct behaviour. Read the per-task
# engagement breakdown in the analysis report before reading any aggregate:
# those two families should not be expected to move in the same direction.
#
#   PYTHONPATH="$(pwd)" harbor run -c harbor/jobs/corpus-eval-ab.yaml
#
# >>> EDIT ME <<< both model_name values (they MUST match) before running.
#
job_name: akm-corpus-eval-ab

# Where trial directories are written, relative to the working directory.
# Results land in <jobs_dir>/<job_name>/<trial>/ -- trial dirs are DIRECT
# children of the job dir, with NO intervening per-task directory level.
# VERIFIED against Harbor v0.22.0 source (see tb2-ab.yaml's jobs_dir comment
# for the exact citation); bin/check-harbor-contract re-asserts it on every
# Harbor bump. analysis/src/loader.ts walks exactly this two-level shape.
jobs_dir: jobs

# One attempt per (task x agent). P0 only asks "did akm_* tools get called",
# which is a binary observation, not a rate -- raise this only once you start
# comparing scores.
n_attempts: 3

# Run trials sequentially. Both arms npm-install into their own container and
# the treatment arm pulls ~432MB; concurrency here mostly buys registry
# throttling and noisy timing.
n_concurrent_trials: 4

# Show trial progress. Set true for CI.
quiet: false

# No timeout scaling. The AGENT phase budget comes from each task's own
# [agent] timeout_sec (the benchmark-defined value); only the SETUP budget is
# pinned per agent (override_setup_timeout_sec below), identically on both
# arms. A multiplier here would scale whatever base each arm resolves, so
# leaving it at 1.0 is what keeps the agent budget equal to the official one.
timeout_multiplier: 1.0

environment:
  # Local Docker. Requires a running Docker daemon -- `docker ps` must work.
  type: docker
  # Reuse a cached task image when one exists. Set true to force a rebuild
  # after editing a task's Dockerfile.
  force_build: false
  # Remove containers after each trial. MUST stay true: the akm bundle is
  # seeded per container and akm_remember / auto-feedback write into it during
  # a trial, so a reused container would let trials contaminate each other.
  delete: true

agents:
  # ------------------------------------------------------------------ CONTROL
  # Stock opencode. Every field below is chosen so the ONLY differences from
  # the treatment arm are (a) the `plugin` array, (b) the top-level `tools` map
  # that enables the five akm_* tools and (c) the AKM_* environment. Anything
  # else that differs is a confound.
  - name: opencode

    # >>> EDIT ME <<< must be byte-identical to the treatment arm's model_name.
    # NOTE: `-m/--model` on the command line does NOT override this. Harbor only
    # applies -m when --agent is also passed, and --agent REPLACES the entire
    # agents list from this file. Edit the value here.
    model_name: PROVIDER/MODEL

    kwargs:
      # opencode-ai npm pin. Repeated verbatim from OPENCODE_VERSION in
      # harbor/akm_opencode.py -- the control arm cannot import that constant,
      # so harbor/tests/test_akm_opencode.py asserts the two stay in sync.
      # Both arms must run the same opencode binary.
      version: "1.18.21"

      opencode_config:
        # Mirrors AkmOpenCode._DEFAULT_CONFIG so the two arms write the same
        # base config.
        "$schema": https://opencode.ai/config.json
        autoupdate: false

        # Mirrors SHARED_PERMISSIONS in harbor/akm_opencode.py: the COMPLETE
        # set of keys opencode 1.18.21's Config.permission declares
        # (@opencode-ai/sdk dist/gen/types.gen.d.ts:1161-1169), and nothing
        # else. There is no read/write/grep/glob/list/patch key in that schema,
        # and the akm_* tools are not permission keys at all -- they live in the
        # separate top-level `tools` map that only the treatment arm carries.
        #
        # Honest rationale: Harbor's OpenCode.run() already passes
        # --dangerously-skip-permissions, so this block gates nothing today. It
        # is belt-and-braces against a Harbor upgrade that drops that flag --
        # and it is repeated here because belt-and-braces on ONE arm is a
        # confound: it would entangle "plugin present" with "permissions
        # granted". harbor/tests/test_akm_opencode.py asserts this block equals
        # SHARED_PERMISSIONS exactly.
        #
        # Side benefit of a non-empty config here: OpenCode.model_connection
        # applies without_inferred_base_url() whenever opencode_config is
        # truthy. The treatment arm always has a truthy config, so giving the
        # control arm one too keeps both arms on the same base-URL branch.
        permission:
          edit: allow
          bash: allow
          webfetch: allow
          doom_loop: allow
          external_directory: allow

    # Same allowlist entry as the treatment arm. The control arm has no plugin
    # to fetch at session start, so it will not use this -- it is here to keep
    # the two arms' network policy identical.
    extra_allowed_hosts:
      - registry.npmjs.org
      # Local OpenAI-compatible inference endpoint (LM Studio on the LAN).
      # Identical on both arms -- a host allowed on one arm only is a confound.

    # Belt-and-braces with `opencode_config.autoupdate: false` above, and
    # deliberately symmetric with the treatment arm: AkmOpenCode.AKM_ENV sets
    # OPENCODE_DISABLE_AUTOUPDATE=true in the treatment process env (a SECOND,
    # independent mechanism for the same intent), which this arm has no
    # equivalent of without this. Two different mechanisms enforcing the same
    # thing are not provably equivalent in opencode 1.18.21 -- if the config
    # key were ever weaker than the env var, only this arm would attempt an
    # autoupdate network call, which is a confound (a network call and a
    # latency difference on the control arm only), not a convenience.
    env:
      OPENCODE_DISABLE_AUTOUPDATE: "true"

    # Harbor's default agent-setup timeout is 360s, which the treatment arm
    # will blow through. Set on both arms so the phase budgets match; the
    # control arm simply finishes early.
    override_setup_timeout_sec: 2700

    # No AGENT-phase override. The task's own [agent] timeout_sec governs, on
    # both arms -- it is the benchmark-defined budget, and honoring it is what
    # keeps these numbers comparable to published leaderboard numbers. A flat
    # override_timeout_sec used to sit here because the treatment arm pays
    # plugin session-start work inside the agent phase that this arm never
    # pays, so an asymmetric effective budget could make a treatment-only
    # AgentTimeoutError read as "akm failed the task". That residual cost is
    # mitigated, not proven to be zero: install() pre-warms opencode's two
    # plugin caches and the npm cache, and the install self-check ASSERTS the
    # warm cache, so the agent phase should not pay a cold plugin fetch.

    # NO exclude_logs, and the two arms must collect logs identically or the
    # evidence base is asymmetric. opencode's XDG_DATA_HOME is
    # /logs/agent/opencode/xdg-data, and its session log --
    # /logs/agent/opencode/xdg-data/opencode/log/*.log -- is where the plugin's
    # client.app.log() lines land: the "AKM CLI resolved" marker that
    # AkmOpenCode._assert_plugin_ran() requires before it will let a treatment
    # trial score, plus the akm.<surface>.<outcome> lines. On this arm the same
    # log is the negative control -- it should contain no akm lines at all.
    # Excluding "opencode/xdg-data/**" is inert on Docker (a mounted
    # environment short-circuits log filtering) but deletes exactly that
    # evidence on any non-mounted/cloud environment, and it cannot be paired
    # with an include: Harbor applies exclude AFTER include
    # (harbor/utils/path_filter.py), so exclude always wins. Trial-dir size is
    # not worth an arm that cannot be verified.

  # ---------------------------------------------------------------- TREATMENT
  # opencode + akm-opencode. Deliberately terse: the agent class force-injects
  # the plugin array, the `tools` map, the permission block and the AKM_*
  # environment, so this arm CANNOT silently degrade into a no-plugin run if
  # this file is wrong -- and if the plugin fails to load at run time anyway,
  # populate_context_post_run() errors the trial instead of scoring it.
  - import_path: harbor.akm_opencode:AkmOpenCode

    # >>> EDIT ME <<< must equal the control arm's model_name exactly.
    model_name: PROVIDER/MODEL

    kwargs:
      # Same opencode pin as the control arm. AkmOpenCode defaults to
      # OPENCODE_VERSION when this is omitted; stated explicitly so the two
      # arms are visibly pinned together in one file.
      version: "1.18.21"
      #
      # NOT set here, on purpose:
      #   opencode_config -- the class force-merges `plugin` and `permission`
      #     into the highest-precedence layer. Anything set here is merged
      #     UNDER those two keys, so use it only for genuinely extra config.
      #   akm_plugin_spec / akm_cli_spec -- pinned by AKM_PLUGIN_SPEC and
      #     AKM_CLI_SPEC in harbor/akm_opencode.py. Override only to test a
      #     different plugin build.
      #   akm_plugin_spec / akm_cli_spec -- see p0-smoke.yaml.
      #
      # The D6 treatment library, not the smoke fixture: this task is an
      # akm-relevant corpus task, so the arm must carry the library the corpus
      # was authored against. Relative to the process working directory, same
      # as tb2-ab.yaml / swebench-ab.yaml.
      seed_library_dir: harbor/treatment-library

    # Required. opencode installs npm plugins at SESSION START, i.e. during
    # agent.run(), where the task's agent-phase network policy applies. If the
    # task uses an allowlist network mode, the plugin fetch fails there even
    # though setup had network. install() also pre-warms the cache, so this is
    # the second of two independent mitigations.
    extra_allowed_hosts:
      - registry.npmjs.org
      # Local OpenAI-compatible inference endpoint (LM Studio on the LAN).
      # Identical on both arms -- a host allowed on one arm only is a confound.

    # This arm's install() does: node + opencode-ai, then `npm i -g akm-cli`
    # (~432MB), then bundle seed + index, then a full opencode boot (with this
    # arm's real config and model name) to warm both plugin caches, then the
    # self-check. 360s is not enough.
    override_setup_timeout_sec: 2700

    # No AGENT-phase override, same as the control arm -- the task's own
    # [agent] timeout_sec governs. This arm's session-start cost is mitigated
    # by install()'s cache pre-warm plus the self-check that asserts it; that
    # is a mitigation, not a proof of zero cost.

    # NO exclude_logs, for the same reason as the control arm -- and here it is
    # load-bearing rather than merely tidy: opencode's log under XDG_DATA_HOME
    # carries the "AKM CLI resolved" line that this arm's
    # populate_context_post_run() requires. Excluding "opencode/xdg-data/**"
    # would turn every treatment trial into an error on a non-mounted
    # environment. See docs/harbor-p0.md section 4.

    # Operator escape hatch. Values here reach the container as a Trial scoped
    # exec-env overlay, which BaseEnvironment._merge_env applies LAST -- so
    # anything set here overrides the class's AKM_ENV defaults. Left empty
    # because the defaults are already the benchmark-correct ones; uncomment to
    # flip a kill switch without editing Python.
    env: {}
      # AKM_AUTO_CURATE: "0"
      # AKM_AUTO_HINTS: "0"

# >>> EDIT ME <<<
# ONE task. `path` is relative to the working directory you run harbor from.
#
# The easiest starting point is harbor's own example task set: clone the harbor
# repo and point `path` at its `examples/tasks`, which contains `hello-world`.
# That task is trivial, so treat a green P0 as "the plumbing works and the model
# can reach akm_* tools", never as evidence that akm helps.
#
# A task that actually rewards recall from the seeded library is the natural
# next step, and picking one is an open decision (see harbor/seed-library/
# README.md).
datasets:
  - path: harbor/tasks
    task_names:
      - drillbit--backup-policy
      - drillbit--canary-enable
      - drillbit--provision-edge
      - drillbit--rotate-secret
      - drillbit--scale-replicas
      - inkwell--add-healthcheck
      - inkwell--configure-scaling
      - inkwell--cpu-scaling
      - inkwell--full-config
      - inkwell--new-service
      - inkwell--set-rate-limit
      - inkwell--workflow-configure-scaling
      - opencode--agents-md-akm-snippet
      - opencode--provider-akm-feedback
      - opencode--select-correct-skill
      - workflow-compliance--abstention-rust-async-haiku
      - workflow-compliance--distractor-docker-port-publish
      - workflow-compliance--repeated-fail-opencode-provider-token-eval
      - workflow-compliance--repeated-fail-storage-lifecycle-eval
    # ------------------------------------------------- MEASUREMENT EXCLUSION
    # workflow-compliance--repeated-fail-opencode-disable-provider is a TRAIN
    # task, so it is already absent from the 19 names above. The bar is stated
    # here anyway because Harbor applies exclude_task_names AFTER task_names
    # (harbor/models/job/config.py:_filter_task_ids), so it survives that list
    # being regenerated from a registry slice or widened to a glob.
    #
    # THE LEAK, in short: akm-opencode's format-declaration write gate reads
    # the `"$schema": "https://opencode.ai/config.json"` in that task's
    # environment/workspace/config/opencode.json, resolves it against the
    # task's own stash = "noisy", and hands the model `skills/opencode` --
    # which is that task's gold_ref -- unasked. The task exists to measure
    # whether the model CHOOSES to look that asset up (expected_workflows =
    # ["akm-lookup-before-edit", ...]), and the gate exists only on the akm
    # arm, so the pass would accrue to the treatment arm from the harness
    # rather than from the model. Full write-up, including the sweep of all 74
    # workspace files that found no other affected task, is in
    # harbor/jobs/corpus-train-ab.yaml at the same block.
    #
    # This is a MEASUREMENT decision, not a broken task: the task, its verifier
    # and its stash are correct and unmodified, and it still runs and scores
    # normally under the oracle and nop agents and in any single-arm run.
    exclude_task_names:
      - workflow-compliance--repeated-fail-opencode-disable-provider
