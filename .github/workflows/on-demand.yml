name: On-Demand Tests

on:
  workflow_dispatch:
    inputs:
      run_llm_tests:
        description: 'Also run a live agent smoke benchmark (requires the OPENCODE_API_KEY secret and a reachable Docker daemon)'
        type: boolean
        default: false

jobs:
  # Same three jobs as ci.yml, exposed here behind a manual trigger so they
  # can be re-run on demand outside of a push/PR. None of these need API
  # keys or Docker; see ci.yml for the per-job rationale.
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run baseline checks
        run: bun run check

      - name: Run deterministic benchmark CLI smoke
        run: AKM_BENCH_RUN_CLI_TESTS=1 bun test ./tests/cli.test.ts

  harbor-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install harbor and test dependencies
        run: pip install -r harbor/requirements.txt pytest pyyaml

      - name: Run harbor agent unit tests
        run: pytest harbor/tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run the Harbor contract check
        run: HARBOR_PYTHON=python bin/check-harbor-contract

  analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run analysis tests
        run: bun test analysis

  # Opt-in only: runs when the caller explicitly ticks run_llm_tests, and only
  # after the non-LLM jobs above pass. Runs the Bun harness's own documented
  # smoke path (README's Quick Start: config/nano-quick.json is "the fastest
  # way to verify your setup works"), not the multi-hour Harbor A/B
  # (bin/ab-run) or the P2 three-arm configs -- those are not smoke-sized.
  # The committed config/opencode.json points at a maintainer's LAN LM Studio
  # instance, so this job uses config/opencode.ci.json instead, which points
  # at opencode Zen via {env:OPENCODE_API_KEY} -- the same provider akm-eval's
  # committed config/opencode.json already uses for CI-safe runs.
  llm-smoke:
    needs: [check, harbor-agent, analysis]
    if: ${{ github.event.inputs.run_llm_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check OPENCODE_API_KEY is configured
        if: ${{ env.OPENCODE_API_KEY == '' }}
        run: |
          echo "run_llm_tests was requested but the OPENCODE_API_KEY secret is not set on this repository." >&2
          exit 1

      - name: Run nano-quick benchmark smoke
        run: bash bin/akm-bench run config/nano-quick.json --results-dir ./results/ci-smoke --opencode-config config/opencode.ci.json

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke-results
          path: results/ci-smoke
          if-no-files-found: ignore
